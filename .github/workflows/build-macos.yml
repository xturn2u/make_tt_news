name: Build macOS MVP

on:
  push:
    branches: [main, feature/contentflow-studio-v1, feature/in-app-runtime-manager, feature/ux-captions-cancel-debug, feature/local-ai-tts-qwen-chatterbox]
  workflow_dispatch:

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  macos-app:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install frontend dependencies
        run: npm ci
      - name: Build universal macOS app
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app
      - name: Verify app bundle
        run: |
          test -d "src-tauri/target/universal-apple-darwin/release/bundle/macos/TikTok News Studio Local.app"
          test -x "src-tauri/target/universal-apple-darwin/release/bundle/macos/TikTok News Studio Local.app/Contents/MacOS/tiktok-news-studio-local"
      - name: Create DMG installer
        run: |
          mkdir -p dist
          cp -R "src-tauri/target/universal-apple-darwin/release/bundle/macos/TikTok News Studio Local.app" dist/
          hdiutil create -volname "ContentFlow Studio" -srcfolder dist -ov -format UDZO "ContentFlow-Studio-macOS-universal.dmg"
      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: ContentFlow-Studio-macOS-universal-dmg
          path: ContentFlow-Studio-macOS-universal.dmg
          if-no-files-found: error
      - name: Upload app bundle directly
        uses: actions/upload-artifact@v4
        with:
          name: ContentFlow-Studio-macOS-universal-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/TikTok News Studio Local.app
          if-no-files-found: error
          include-hidden-files: true
