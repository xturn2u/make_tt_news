name: Build macOS MVP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  macos-app:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install frontend dependencies
        run: npm ci
      - name: Build universal macOS app
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app
      - name: Package app bundle
        run: |
          package_dir=$(mktemp -d)
          archive_path="$package_dir/TikTok-News-Studio-Local-macOS-universal.zip"
          zip -qry "$archive_path" "src-tauri/target/universal-apple-darwin/release/bundle/macos/TikTok News Studio Local.app"
          unzip -t "$archive_path"
          mv "$archive_path" "TikTok-News-Studio-Local-macOS-universal.zip"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-News-Studio-Local-macOS-universal
          path: TikTok-News-Studio-Local-macOS-universal.zip
          if-no-files-found: error
