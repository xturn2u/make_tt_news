[package]
name = "tiktok-news-studio-local"
version = "0.1.0"
description = "Local-first AI workflow studio for TikTok news production"
authors = ["TikTok News Studio"]
edition = "2021"

[lib]
name = "tiktok_news_studio_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
