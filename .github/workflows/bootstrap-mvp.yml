name: Bootstrap and verify macOS MVP

on:
  push:
    branches: [main]
    paths:
      - "mvp-bootstrap.b64"
      - "mvp-bootstrap.part-*"
      - ".github/workflows/bootstrap-mvp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build-commit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore MVP source tree
        shell: bash
        run: |
          set -euo pipefail
          expected_parts=(mvp-bootstrap.part-00 mvp-bootstrap.part-01 mvp-bootstrap.part-02 mvp-bootstrap.part-03 mvp-bootstrap.part-04 mvp-bootstrap.part-05 mvp-bootstrap.part-06 mvp-bootstrap.part-07)
          for part in "${expected_parts[@]}"; do
            test -f "$part"
            test "$(wc -c < "$part" | tr -d ' ')" -gt 0
          done
          test "$(find . -maxdepth 1 -type f -name 'mvp-bootstrap.part-*' | wc -l | tr -d ' ')" = "8"
          cat "${expected_parts[@]}" > "$RUNNER_TEMP/mvp.b64"
          test "$(wc -c < "$RUNNER_TEMP/mvp.b64" | tr -d ' ')" = "26068"
          base64 --decode --input "$RUNNER_TEMP/mvp.b64" --output "$RUNNER_TEMP/mvp.tar.gz"
          echo "e0435af4c3888f6dae0702039ccce7907fa3972caee2b33da88d7cd2451ec237  $RUNNER_TEMP/mvp.tar.gz" | shasum -a 256 -c -
          tar -tzf "$RUNNER_TEMP/mvp.tar.gz" | awk 'BEGIN { bad=0 } /^\// || /(^|\/)\.\.\// { bad=1; print "Unsafe archive path: " $0 } END { exit bad }'
          mkdir -p "$RUNNER_TEMP/mvp-root"
          tar -xzf "$RUNNER_TEMP/mvp.tar.gz" -C "$RUNNER_TEMP/mvp-root"
          test -f "$RUNNER_TEMP/mvp-root/package.json"
          test -f "$RUNNER_TEMP/mvp-root/src-tauri/Cargo.toml"
          cp -a "$RUNNER_TEMP/mvp-root/." "$GITHUB_WORKSPACE/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Frontend build
        run: npm run build

      - name: Generate Tauri icons
        run: npm run icons

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build universal macOS app
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/TikTok News Studio Local.app" "TikTok-News-Studio-Local-macOS-universal.zip"

      - name: Replace bootstrap with verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f mvp-bootstrap.b64 mvp-bootstrap.part-* .github/workflows/bootstrap-mvp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN cannot create or update workflow files. The source
          # workflow is retained in the runner for a follow-up authenticated
          # commit, while all application source is committed here.
          git add -A -- ':!.github/workflows/build-macos.yml'
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: verified local-first TikTok News Studio MVP"
            git push origin HEAD:main
          fi

      - name: Upload verified macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-News-Studio-Local-macOS-universal
          path: TikTok-News-Studio-Local-macOS-universal.zip
          if-no-files-found: error
