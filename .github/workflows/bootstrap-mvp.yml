name: Bootstrap and verify macOS MVP

on:
  push:
    branches: [main]
    paths:
      - "mvp-bootstrap.b64"
      - ".github/workflows/bootstrap-mvp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build-commit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore MVP source tree
        shell: bash
        run: |
          cat mvp-bootstrap.part-* > /tmp/mvp.b64
          test "$(wc -c < /tmp/mvp.b64 | tr -d ' ')" = "26068"
          base64 -d -i /tmp/mvp.b64 -o /tmp/mvp.tar.gz
          echo "e0435af4c3888f6dae0702039ccce7907fa3972caee2b33da88d7cd2451ec237  /tmp/mvp.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/mvp.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Frontend build
        run: npm run build

      - name: Generate Tauri icons
        run: npm run icons

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build universal macOS app
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/TikTok News Studio Local.app" "TikTok-News-Studio-Local-macOS-universal.zip"

      - name: Replace bootstrap with verified source
        shell: bash
        run: |
          rm -f mvp-bootstrap.b64 mvp-bootstrap.part-* .github/workflows/bootstrap-mvp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: verified local-first TikTok News Studio MVP"
            git push origin HEAD:main
          fi

      - name: Upload verified macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-News-Studio-Local-macOS-universal
          path: TikTok-News-Studio-Local-macOS-universal.zip
          if-no-files-found: error
